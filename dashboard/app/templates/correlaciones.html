<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <title>Correlaciones entre Productos</title>
    <script src="https://d3js.org/d3.v7.min.js"></script>
    <style>
      body {
        background-color: #0d1117;
        color: #f0f6fc;
        font-family: "Segoe UI", sans-serif;
        display: flex;
        flex-direction: column;
        align-items: center;
      }
      h2 {
        color: #58a6ff;
        margin-top: 20px;
      }
      svg {
        margin-top: 20px;
      }
      .tooltip {
        position: absolute;
        background: rgba(255, 255, 255, 0.9);
        color: #000;
        padding: 6px 10px;
        border-radius: 6px;
        font-size: 13px;
        pointer-events: none;
        opacity: 0;
        transition: opacity 0.2s ease;
      }
    </style>
  </head>
  <body>
    <h2>🔗 Correlaciones entre Productos</h2>
    <svg width="100%" height="800"></svg>
    <div class="tooltip" id="tooltip"></div>

    <script>
        var data = {{ data | tojson | safe }};
        var categorias = {{ categorias | tojson | safe }};
        console.log(data)
        console.log(categorias)

      // --- Categorías ---
      // const categorias = [
      //   "Chocolates y Galletas",
      //   "Cafés y Bebidas",
      //   "Fórmulas Infantiles",
      //   "Mascotas",
      //   "Cocina y Repostería",
      //   "Leches Vegetales",
      // ];

      // --- Matriz de correlaciones (valores entre 0 y 1) ---
      // const matrix = [
      //   [0, 0.36, 0.22, 0.15, 0.05, 0.12],
      //   [0.36, 0, 0.42, 0.09, 0.15, 0.25],
      //   [0.22, 0.42, 0, 0.1, 0.35, 0.19],
      //   [0.15, 0.09, 0.1, 0, 0.14, 0.12],
      //   [0.05, 0.15, 0.35, 0.14, 0, 0.31],
      //   [0.12, 0.25, 0.19, 0.12, 0.31, 0],
      // ];

      const matrix = data;

      const width = 800,
        height = 800,
        innerRadius = 300,
        outerRadius = 320;

      const color = d3
        .scaleOrdinal()
        .domain(d3.range(categorias.length))
        .range([
          "#1f77b4",
          "#ff7f0e",
          "#2ca02c",
          "#d62728",
          "#9467bd",
          "#8c564b",
        ]);

      const svg = d3
        .select("svg")
        .attr("viewBox", [0, 0, width, height])
        .append("g")
        .attr("transform", `translate(${width / 2},${height / 2})`);

      const tooltip = d3.select("#tooltip");

      const chord = d3.chord().padAngle(0.05).sortSubgroups(d3.descending)(
        matrix
      );

      const arc = d3.arc().innerRadius(innerRadius).outerRadius(outerRadius);

      const ribbon = d3.ribbon().radius(innerRadius);

      // --- Arcos (categorías) ---
      const group = svg.append("g").selectAll("g").data(chord.groups).join("g");

      group
        .append("path")
        .attr("fill", (d) => color(d.index))
        .attr("stroke", (d) => d3.rgb(color(d.index)).darker())
        .attr("d", arc);

      group
        .append("text")
        .each((d) => {
          d.angle = (d.startAngle + d.endAngle) / 2;
        })
        .attr("dy", ".35em")
        .attr(
          "transform",
          (d) => `
        rotate(${(d.angle * 180) / Math.PI - 90})
        translate(${outerRadius + 10})
        ${d.angle > Math.PI ? "rotate(180)" : ""}
      `
        )
        .attr("text-anchor", (d) => (d.angle > Math.PI ? "end" : "start"))
        .text((d) => categorias[d.index])
        .style("fill", "#f0f6fc")
        .style("font-size", "12px");

      // --- Cuerdas con tooltip ---
      svg
        .append("g")
        .attr("fill-opacity", 0.75)
        .selectAll("path")
        .data(chord)
        .join("path")
        .attr("d", ribbon)
        .attr("fill", (d) => color(d.target.index))
        .attr("stroke", "#000")
        .on("mouseover", function (event, d) {
          const value = matrix[d.source.index][d.target.index];
          tooltip.transition().style("opacity", 1);
          tooltip
            .html(
              `<strong>${categorias[d.source.index]}</strong> ↔ <strong>${
                categorias[d.target.index]
              }</strong><br>Correlación: <b>${value.toFixed(3)}</b>`
            )
            .style("left", event.pageX + 10 + "px")
            .style("top", event.pageY - 20 + "px");
          d3.select(this).attr("fill-opacity", 1);
        })
        .on("mousemove", function (event) {
          tooltip
            .style("left", event.pageX + 10 + "px")
            .style("top", event.pageY - 20 + "px");
        })
        .on("mouseout", function () {
          tooltip.transition().style("opacity", 0);
          d3.select(this).attr("fill-opacity", 0.75);
        });
    </script>
  </body>
</html>
